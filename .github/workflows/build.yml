name: Initial source publication
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore reviewed public source
        shell: pwsh
        run: |
          $sourceZip = Join-Path $env:RUNNER_TEMP 'public-source.zip'
          $sourceDir = Join-Path $env:RUNNER_TEMP 'public-source'
          [IO.File]::WriteAllBytes($sourceZip, [Convert]::FromBase64String(''))
          Expand-Archive -LiteralPath $sourceZip -DestinationPath $sourceDir
          if (!(Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.git'))) { throw 'Not a repository checkout' }
          Get-ChildItem -LiteralPath $sourceDir -Force | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $env:GITHUB_WORKSPACE -Recurse -Force }
          git config user.name klaushuanghy
          git config user.email 49896487+klaushuanghy@users.noreply.github.com
          git add --all
          git commit -m 'Publish downloader source and Chinese documentation'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Source push failed' }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          architecture: x64
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:public
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package
      - name: Publish Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0 --target main --title '花瓣原图下载器 v1.1.0' --notes-file docs/RELEASE-v1.1.0.md (Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
