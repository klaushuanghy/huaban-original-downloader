name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          architecture: x64
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:public
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: HuabanOriginalDownloader-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
